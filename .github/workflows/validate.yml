name: Validate Milyan corpus
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tl55_collation.py
      - run: python -m unittest discover -s tests -p test_tl55_collation.py
      - run: python scripts/validate_tl55_reconciliation.py
      - run: python -m unittest discover -s tests -p test_validate_tl55_reconciliation.py
      - run: python scripts/build_current_summary.py --check
      - run: python scripts/test_current_summary.py
      - run: python scripts/validate_corpus.py
      - run: python ai-skill/scripts/build_bundle.py
      - run: python ai-skill/scripts/validate_bundle.py
      - run: python tests/test_research_api.py
      - run: python tests/test_fleet_contract.py
      - run: python scripts/build_reference.py
      - run: python -m unittest discover -s tests -p test_reference.py
